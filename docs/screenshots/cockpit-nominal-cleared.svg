<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgNom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="cardGradNom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="emeraldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgNom)"/>

  <!-- Medical Grid Background -->
  <g opacity="0.08">
    <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200 M 0 240 L 800 240 M 0 280 L 800 280 M 0 320 L 800 320 M 0 360 L 800 360 M 0 400 L 800 400 M 0 440 L 800 440" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 40 0 L 40 480 M 80 0 L 80 480 M 120 0 L 120 480 M 160 0 L 160 480 M 200 0 L 200 480 M 240 0 L 240 480 M 280 0 L 280 480 M 320 0 L 320 480 M 360 0 L 360 480 M 400 0 L 400 480 M 440 0 L 440 480 M 480 0 L 480 480 M 520 0 L 520 480 M 560 0 L 560 480 M 600 0 L 600 480 M 640 0 L 640 480 M 680 0 L 680 480 M 720 0 L 720 480 M 760 0 L 760 480" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Top Micro-Bar -->
  <g transform="translate(20, 16)">
    <rect width="760" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="22" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" letter-spacing="1">SURGIGUARD AI // CASE #SG-9042</text>
    <text x="250" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PROCEDURE: LAPAROSCOPIC COLECTOMY</text>
    <text x="610" y="22" fill="#10B981" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">PHASE: PRE-CLOSURE</text>
  </g>

  <!-- Giant Emerald Status Banner -->
  <g transform="translate(20, 60)">
    <rect width="760" height="70" rx="12" fill="url(#emeraldBanner)" stroke="#10B981" stroke-width="2" filter="url(#glowE)"/>
    <circle cx="42" cy="35" r="18" fill="#047857"/>
    <path d="M 34 35 L 40 41 L 51 29" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="29" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" letter-spacing="1.5">DETERMINISTIC CLOSURE GATE &bull; SOVEREIGN INTERLOCK</text>
    <text x="74" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">STATUS: CLEARED [GO] &bull; ALL 19 ITEMS RECONCILED</text>
    
    <rect x="610" y="18" width="134" height="34" rx="6" fill="#065F46" stroke="#34D399"/>
    <text x="622" y="39" fill="#ECFDF5" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">&Delta;=0 &bull; CAVITY=0</text>
  </g>

  <!-- Left Column: Mayo Tray Vision Stream -->
  <g transform="translate(20, 142)">
    <rect width="420" height="320" rx="12" fill="url(#cardGradNom)" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="396" height="24" rx="5" fill="#0B0F17"/>
    <text x="20" y="28" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">MAYO TRAY OPTICAL VISION (GEMINI 2.5 FLASH)</text>

    <!-- Synthetic Tray Area -->
    <rect x="12" y="44" width="396" height="262" rx="8" fill="#070A10" stroke="#334155" stroke-dasharray="3,3"/>

    <!-- Bounding Box 1: Sponges -->
    <rect x="24" y="56" width="180" height="110" rx="6" fill="rgba(6,182,212,0.12)" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="24" y="56" width="140" height="16" rx="3" fill="#083344"/>
    <text x="30" y="68" fill="#E0F2FE" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Lap Sponge 4x4 (10) [RX-TAG]</text>

    <!-- Bounding Box 2: Needles -->
    <rect x="220" y="56" width="176" height="110" rx="6" fill="rgba(99,102,241,0.12)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="220" y="56" width="130" height="16" rx="3" fill="#1E1B4B"/>
    <text x="226" y="68" fill="#EEF2FF" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">3-0 Vicryl Suture (5)</text>

    <!-- Bounding Box 3: Forceps -->
    <rect x="24" y="180" width="372" height="112" rx="6" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="24" y="180" width="160" height="16" rx="3" fill="#064E3B"/>
    <text x="30" y="192" fill="#ECFDF5" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Curved Mayo Forceps (4) [OK]</text>
  </g>

  <!-- Right Column: Deterministic Balance Registry -->
  <g transform="translate(452, 142)">
    <rect width="328" height="320" rx="12" fill="url(#cardGradNom)" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="304" height="24" rx="5" fill="#0B0F17"/>
    <text x="20" y="28" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">DETERMINISTIC BALANCE MATRIX</text>

    <!-- Item 1 -->
    <g transform="translate(12, 44)">
      <rect width="304" height="46" rx="6" fill="#0B0F17" stroke="#1E293B"/>
      <text x="10" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Lap Sponge 4x4 (Radiopaque)</text>
      <text x="10" y="34" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9">Baseline: 10 &bull; Tray: 10 &bull; Cavity: 0</text>
      <rect x="230" y="12" width="64" height="22" rx="4" fill="#064E3B"/>
      <text x="238" y="27" fill="#34D399" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(12, 98)">
      <rect width="304" height="46" rx="6" fill="#0B0F17" stroke="#1E293B"/>
      <text x="10" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3-0 Vicryl Suture Needle</text>
      <text x="10" y="34" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9">Baseline: 5 &bull; Tray: 5 &bull; Cavity: 0</text>
      <rect x="230" y="12" width="64" height="22" rx="4" fill="#064E3B"/>
      <text x="238" y="27" fill="#34D399" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(12, 152)">
      <rect width="304" height="46" rx="6" fill="#0B0F17" stroke="#1E293B"/>
      <text x="10" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Curved Mayo Forceps &amp; Scissors</text>
      <text x="10" y="34" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9">Baseline: 4 &bull; Tray: 4 &bull; Cavity: 0</text>
      <rect x="230" y="12" width="64" height="22" rx="4" fill="#064E3B"/>
      <text x="238" y="27" fill="#34D399" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Bottom Gemini Audio Card -->
    <g transform="translate(12, 206)">
      <rect width="304" height="100" rx="6" fill="#0B0F17" stroke="#312E81"/>
      <text x="10" y="18" fill="#818CF8" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">GEMINI 2.5 FLASH OR AUDIO BRIEFING:</text>
      <text x="10" y="38" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">&ldquo;Surgical count 100% verified. All 10 sponges, 5 needles, and 4 instruments reconciled. Closure cleared.&rdquo;</text>
      <rect x="10" y="66" width="284" height="24" rx="4" fill="#1E1B4B"/>
      <text x="18" y="82" fill="#C7D2FE" font-family="ui-monospace, monospace" font-size="8.5">CONFIDENCE: 98.4% &bull; RX-TAGS: VERIFIED</text>
    </g>
  </g>
</svg>
