      <text x="10" y="29" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5">Baseline: 5 &bull; Tray: 5 &bull; Cavity: 0</text>
      <rect x="260" y="9" width="60" height="20" rx="3" fill="#064E3B"/>
      <text x="268" y="23" fill="#34D399" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(10, 126)">
      <rect width="330" height="38" rx="5" fill="#0B0F17" stroke="#1E293B"/>
      <text x="10" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Curved Mayo Forceps &amp; Scissors</text>
      <text x="10" y="29" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5">Baseline: 4 &bull; Tray: 4 &bull; Cavity: 0</text>
      <rect x="260" y="9" width="60" height="20" rx="3" fill="#064E3B"/>
      <text x="268" y="23" fill="#34D399" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold">&Delta;=0 [OK]</text>
