    <path d="M 35 0 L 35 420 M 70 0 L 70 420 M 105 0 L 105 420 M 140 0 L 140 420 M 175 0 L 175 420 M 210 0 L 210 420 M 245 0 L 245 420 M 280 0 L 280 420 M 315 0 L 315 420 M 350 0 L 350 420 M 385 0 L 385 420 M 420 0 L 420 420 M 455 0 L 455 420 M 490 0 L 490 420 M 525 0 L 525 420 M 560 0 L 560 420 M 595 0 L 595 420 M 630 0 L 630 420 M 665 0 L 665 420 M 700 0 L 700 420 M 735 0 L 735 420 M 770 0 L 770 420 M 805 0 L 805 420" stroke="#38BDF8" stroke-width="1"/>
