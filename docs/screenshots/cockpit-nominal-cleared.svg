<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="emeraldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="glowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgNom)"/>

  <!-- Top Bar -->
  <g transform="translate(30, 20)">
    <rect width="940" height="40" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="16" y="25" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">SURGIGUARD AI v2.0 // CASE #SG-9042 // LAPAROSCOPIC COLECTOMY</text>
    <text x="740" y="25" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">PHASE: PRE-CLOSURE [3/4]</text>
  </g>

  <!-- Big Emerald Gate Status Banner -->
  <g transform="translate(30, 75)">
    <rect width="940" height="85" rx="14" fill="url(#emeraldBanner)" stroke="#10B981" stroke-width="2.5" filter="url(#glowE)"/>
    <circle cx="50" cy="42" r="22" fill="#047857"/>
    <path d="M 40 42 L 47 49 L 60 35" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="36" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">DETERMINISTIC CLOSURE GATE &bull; SOVEREIGN STATUS</text>
    <text x="85" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="black" letter-spacing="1">CLEARED [GO] &bull; 100% RECONCILED &bull; ZERO RFO</text>
    <rect x="760" y="26" width="160" height="34" rx="8" fill="#065F46" stroke="#34D399"/>
    <text x="780" y="48" fill="#ECFDF5" font-family="monospace" font-size="12" font-weight="bold">DELTA = 0 &bull; CAVITY = 0</text>
  </g>

  <!-- Left: Tray Canvas Simulation -->
  <g transform="translate(30, 175)">
    <rect width="520" height="395" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <rect x="15" y="15" width="490" height="28" rx="6" fill="#0B0F17"/>
    <text x="25" y="34" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">MAYO TRAY COMPUTER VISION SCANNER (GEMINI 2.5 FLASH)</text>

    <!-- Synthetic Tray with Bounding Boxes -->
    <rect x="25" y="60" width="470" height="315" rx="10" fill="#070A10" stroke="#334155" stroke-dasharray="4,4"/>
    
    <!-- Bounding Box 1: Sponges -->
    <rect x="45" y="80" width="220" height="130" rx="8" fill="rgba(6,182,212,0.12)" stroke="#06B6D4" stroke-width="2"/>
    <rect x="45" y="58" width="160" height="20" rx="4" fill="#083344" stroke="#06B6D4"/>
    <text x="52" y="72" fill="#E0F2FE" font-family="monospace" font-size="9" font-weight="bold">Lap Sponge 4x4 (10) [RX-TAG]</text>

    <!-- Bounding Box 2: Needles -->
    <rect x="290" y="80" width="190" height="100" rx="8" fill="rgba(99,102,241,0.12)" stroke="#818CF8" stroke-width="2"/>
    <rect x="290" y="58" width="160" height="20" rx="4" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="298" y="72" fill="#EEF2FF" font-family="monospace" font-size="9" font-weight="bold">3-0 Vicryl Suture (5)</text>

    <!-- Bounding Box 3: Forceps -->
    <rect x="70" y="235" width="380" height="115" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="2"/>
    <rect x="70" y="215" width="200" height="20" rx="4" fill="#064E3B" stroke="#10B981"/>
    <text x="78" y="229" fill="#ECFDF5" font-family="monospace" font-size="9" font-weight="bold">Curved Mayo Forceps (4)</text>
  </g>

  <!-- Right: Balance Registry Table -->
  <g transform="translate(565, 175)">
    <rect width="405" height="395" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <rect x="15" y="15" width="375" height="28" rx="6" fill="#0B0F17"/>
    <text x="25" y="34" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">DETERMINISTIC BALANCE MATRIX</text>

    <!-- Row 1 -->
    <g transform="translate(15, 60)">
      <rect width="375" height="50" rx="8" fill="#0B0F17" stroke="#1E293B"/>
      <text x="12" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Lap Sponge 4x4 (Radiopaque)</text>
      <text x="12" y="38" fill="#94A3B8" font-family="monospace" font-size="9">Baseline: 10 | Cavity: 0 | Tray: 10</text>
      <rect x="290" y="14" width="75" height="22" rx="4" fill="#064E3B"/>
      <text x="300" y="29" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(15, 120)">
      <rect width="375" height="50" rx="8" fill="#0B0F17" stroke="#1E293B"/>
      <text x="12" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">3-0 Vicryl Suture Needle</text>
      <text x="12" y="38" fill="#94A3B8" font-family="monospace" font-size="9">Baseline: 5 | Cavity: 0 | Tray: 5</text>
      <rect x="290" y="14" width="75" height="22" rx="4" fill="#064E3B"/>
      <text x="300" y="29" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(15, 180)">
      <rect width="375" height="50" rx="8" fill="#0B0F17" stroke="#1E293B"/>
      <text x="12" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Curved Mayo Forceps</text>
      <text x="12" y="38" fill="#94A3B8" font-family="monospace" font-size="9">Baseline: 4 | Cavity: 0 | Tray: 4</text>
      <rect x="290" y="14" width="75" height="22" rx="4" fill="#064E3B"/>
      <text x="300" y="29" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">&Delta;=0 [OK]</text>
    </g>

    <!-- Audio / Spoken OR Briefing -->
    <g transform="translate(15, 245)">
      <rect width="375" height="135" rx="8" fill="#0B0F17" stroke="#312E81"/>
      <text x="12" y="24" fill="#818CF8" font-family="monospace" font-size="10" font-weight="bold">GEMINI ARBITER SPOKEN OR BRIEFING:</text>
      <text x="12" y="50" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-style="italic">&ldquo;Surgical count 100% verified. All ten sponges, five needles, and four instruments reconciled. Closure cleared.&rdquo;</text>
      <rect x="12" y="85" width="350" height="34" rx="6" fill="#1E1B4B" stroke="#4F46E5"/>
      <text x="24" y="106" fill="#C7D2FE" font-family="monospace" font-size="10">CONFIDENCE: 98.4% &bull; RX-TAGS: VERIFIED</text>
    </g>
  </g>
</svg>
