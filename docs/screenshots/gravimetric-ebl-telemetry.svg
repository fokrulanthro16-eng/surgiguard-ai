<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgGrav)"/>

  <!-- Header -->
  <g transform="translate(30, 25)">
    <rect width="940" height="50" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="32" fill="#EF4444" font-family="monospace" font-size="14" font-weight="bold">GRAVIMETRIC SPONGE FLUID &amp; ESTIMATED BLOOD LOSS (EBL) TELEMETRY</text>
    <text x="690" y="32" fill="#FCA5A5" font-family="monospace" font-size="11">FORMULA: EBL (mL) = &Sigma;(Wet - Dry) &divide; 1.06 g/mL</text>
  </g>

  <!-- Metric Gauges -->
  <g transform="translate(30, 95)">
    <!-- 1. EBL -->
    <rect x="0" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="16" y="28" fill="#94A3B8" font-family="monospace" font-size="11">ESTIMATED BLOOD LOSS</text>
    <text x="16" y="75" fill="#EF4444" font-family="sans-serif" font-size="34" font-weight="black">358.5 mL</text>
    <text x="16" y="105" fill="#34D399" font-family="monospace" font-size="11">&bull; CLASS I (&lt; 500 mL) [OK]</text>

    <!-- 2. Gross Wet Weight -->
    <rect x="240" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#38BDF8"/>
    <text x="256" y="28" fill="#94A3B8" font-family="monospace" font-size="11">TOTAL WET SCALE WEIGHT</text>
    <text x="256" y="75" fill="#38BDF8" font-family="sans-serif" font-size="34" font-weight="black">480.0 g</text>
    <text x="256" y="105" fill="#94A3B8" font-family="monospace" font-size="11">Radwag Serial Scale #04</text>

    <!-- 3. Dry Tare Offset -->
    <rect x="480" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#64748B"/>
    <text x="496" y="28" fill="#94A3B8" font-family="monospace" font-size="11">DRY TARE OFFSET</text>
    <text x="496" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="34" font-weight="black">&minus;100.0 g</text>
    <text x="496" y="105" fill="#94A3B8" font-family="monospace" font-size="11">5 Lap Sponges @ 20g dry</text>

    <!-- 4. Net Fluid -->
    <rect x="720" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#A855F7"/>
    <text x="736" y="28" fill="#94A3B8" font-family="monospace" font-size="11">NET ABSORBED FLUID</text>
    <text x="736" y="75" fill="#C084FC" font-family="sans-serif" font-size="34" font-weight="black">380.0 g</text>
    <text x="736" y="105" fill="#94A3B8" font-family="monospace" font-size="11">Fluid density: 1.06 g/mL</text>
  </g>

  <!-- Scale Telemetry Log Table -->
  <g transform="translate(30, 245)">
    <rect width="940" height="225" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <rect x="15" y="15" width="910" height="28" rx="6" fill="#0B0F17"/>
    <text x="25" y="34" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">SERIAL SCALE TELEMETRY LOG &bull; LOINC 55284-4 EXPORT</text>

    <!-- Table Header -->
    <g transform="translate(25, 60)">
      <text x="0" y="0" fill="#64748B" font-family="monospace" font-size="10">BATCH ID</text>
      <text x="140" y="0" fill="#64748B" font-family="monospace" font-size="10">SPONGE TYPE</text>
      <text x="340" y="0" fill="#64748B" font-family="monospace" font-size="10">COUNT</text>
      <text x="440" y="0" fill="#64748B" font-family="monospace" font-size="10">WET WEIGHT</text>
      <text x="580" y="0" fill="#64748B" font-family="monospace" font-size="10">DRY TARE</text>
      <text x="720" y="0" fill="#64748B" font-family="monospace" font-size="10">BLOOD LOSS (EBL)</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(25, 95)">
      <rect x="-10" y="-14" width="910" height="30" rx="4" fill="#0B0F17"/>
      <text x="0" y="6" fill="#38BDF8" font-family="monospace" font-size="11">#WT-09411</text>
      <text x="140" y="6" fill="#FFFFFF" font-family="sans-serif" font-size="11">Lap Sponge 4x4</text>
      <text x="340" y="6" fill="#FFFFFF" font-family="monospace" font-size="11">2x</text>
      <text x="440" y="6" fill="#38BDF8" font-family="monospace" font-size="11">280.0 g</text>
      <text x="580" y="6" fill="#64748B" font-family="monospace" font-size="11">40.0 g</text>
      <text x="720" y="6" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">226.4 mL</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 135)">
      <rect x="-10" y="-14" width="910" height="30" rx="4" fill="#0B0F17"/>
      <text x="0" y="6" fill="#38BDF8" font-family="monospace" font-size="11">#WT-09412</text>
      <text x="140" y="6" fill="#FFFFFF" font-family="sans-serif" font-size="11">Lap Sponge 4x4</text>
      <text x="340" y="6" fill="#FFFFFF" font-family="monospace" font-size="11">3x</text>
      <text x="440" y="6" fill="#38BDF8" font-family="monospace" font-size="11">200.0 g</text>
      <text x="580" y="6" fill="#64748B" font-family="monospace" font-size="11">60.0 g</text>
      <text x="720" y="6" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">132.1 mL</text>
    </g>
  </g>
</svg>
