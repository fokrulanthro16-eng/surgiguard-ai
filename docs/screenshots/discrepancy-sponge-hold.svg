<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgDis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="cardGradDis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="crimsonBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgDis)"/>

  <!-- Medical Grid Background -->
  <g opacity="0.08">
    <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200 M 0 240 L 800 240 M 0 280 L 800 280 M 0 320 L 800 320 M 0 360 L 800 360 M 0 400 L 800 400 M 0 440 L 800 440" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 40 0 L 40 480 M 80 0 L 80 480 M 120 0 L 120 480 M 160 0 L 160 480 M 200 0 L 200 480 M 240 0 L 240 480 M 280 0 L 280 480 M 320 0 L 320 480 M 360 0 L 360 480 M 400 0 L 400 480 M 440 0 L 440 480 M 480 0 L 480 480 M 520 0 L 520 480 M 560 0 L 560 480 M 600 0 L 600 480 M 640 0 L 640 480 M 680 0 L 680 480 M 720 0 L 720 480 M 760 0 L 760 480" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Top Micro-Bar -->
  <g transform="translate(20, 16)">
    <rect width="760" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="22" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" letter-spacing="1">SURGIGUARD AI // CASE #SG-9042</text>
    <text x="250" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PROCEDURE: LAPAROSCOPIC COLECTOMY</text>
    <text x="610" y="22" fill="#EF4444" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">PHASE: PRE-CLOSURE [HOLD]</text>
  </g>

  <!-- Giant Crimson Hazard Status Banner -->
  <g transform="translate(20, 60)">
    <rect width="760" height="70" rx="12" fill="url(#crimsonBanner)" stroke="#EF4444" stroke-width="2" filter="url(#glowH)"/>
    <circle cx="42" cy="35" r="18" fill="#991B1B"/>
    <path d="M 42 24 L 42 38 M 42 44 L 42 46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="29" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" letter-spacing="1.5">DETERMINISTIC CLOSURE GATE &bull; SOVEREIGN INTERLOCK</text>
    <text x="74" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">STATUS: DISCREPANCY [HOLD] &bull; MISSING LAP SPONGE #3</text>
    
    <rect x="610" y="18" width="134" height="34" rx="6" fill="#991B1B" stroke="#F87171"/>
    <text x="626" y="39" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">DELTA = -1 [HOLD]</text>
  </g>

  <!-- Left Column: Mayo Tray Vision Stream with Discrepancy -->
  <g transform="translate(20, 142)">
    <rect width="420" height="320" rx="12" fill="url(#cardGradDis)" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="396" height="24" rx="5" fill="#0B0F17"/>
    <text x="20" y="28" fill="#EF4444" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">MAYO TRAY OPTICAL VISION (SCENARIO B &bull; MISSING SPONGE)</text>

    <!-- Synthetic Tray Area -->
    <rect x="12" y="44" width="396" height="262" rx="8" fill="#070A10" stroke="#EF4444" stroke-dasharray="3,3"/>

    <!-- Bounding Box 1: Sponges (Only 9 detected!) -->
    <rect x="24" y="56" width="180" height="110" rx="6" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="24" y="56" width="160" height="16" rx="3" fill="#7F1D1D"/>
    <text x="30" y="68" fill="#FEE2E2" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Lap Sponge 4x4: 9 OF 10 [MISSING 1]</text>

    <!-- Missing Item Alert Box -->
    <g transform="translate(220, 56)">
      <rect width="176" height="110" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-dasharray="4,4"/>
      <text x="25" y="50" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MISSING SPONGE #3</text>
      <text x="14" y="70" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="8">DELTA: -1 MISSING ITEM</text>
    </g>

    <!-- Bounding Box 2: Needles & Forceps -->
    <rect x="24" y="180" width="372" height="112" rx="6" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="24" y="180" width="200" height="16" rx="3" fill="#064E3B"/>
    <text x="30" y="192" fill="#ECFDF5" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Forceps (4) &amp; Needles (5) [MATCHED]</text>
  </g>

  <!-- Right Column: Discrepancy Breakdown -->
  <g transform="translate(452, 142)">
    <rect width="328" height="320" rx="12" fill="url(#cardGradDis)" stroke="#1E293B" stroke-width="1"/>
    <rect x="12" y="12" width="304" height="24" rx="5" fill="#0B0F17"/>
    <text x="20" y="28" fill="#EF4444" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">ACTIVE DISCREPANCY AUDIT FEED</text>

    <!-- Discrepancy Alert Card -->
    <g transform="translate(12, 44)">
      <rect width="304" height="60" rx="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="10" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">CRITICAL: 1x Lap Sponge 4x4 Missing</text>
      <text x="10" y="36" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9.5">Baseline: 10 &bull; Tray Out: 9 Reconciled</text>
      <text x="10" y="50" fill="#FECACA" font-family="ui-monospace, monospace" font-size="9">Delta = -1 &bull; Surgical closure locked on HOLD</text>
    </g>

    <!-- Spoken OR Audio Card -->
    <g transform="translate(12, 112)">
      <rect width="304" height="90" rx="6" fill="#0B0F17" stroke="#7F1D1D"/>
      <text x="10" y="18" fill="#EF4444" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">SPOKEN ATC / OR VOICE WARNING:</text>
      <text x="10" y="38" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">&ldquo;Attention Surgical Team. Discrepancy detected: Only 9 Lap Sponges counted on tray. Sponge #3 unaccounted for. Closure locked on HOLD.&rdquo;</text>
    </g>

    <!-- Clinical Protocol Actions -->
    <g transform="translate(12, 210)">
      <rect width="304" height="96" rx="6" fill="#0B0F17" stroke="#334155"/>
      <text x="10" y="18" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">CLINICAL RESOLUTION PROTOCOL:</text>
      <text x="10" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">1. Perform peritoneal cavity re-exploration.</text>
      <text x="10" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">2. Order intra-operative C-Arm X-ray sweep.</text>
      <text x="10" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">3. Search surgical drapes and kick buckets.</text>
    </g>
  </g>
</svg>
