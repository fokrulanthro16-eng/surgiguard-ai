<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="crimsonBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgDis)"/>

  <!-- Top Bar -->
  <g transform="translate(30, 20)">
    <rect width="940" height="40" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="16" y="25" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">SURGIGUARD AI v2.0 // CASE #SG-9042 // LAPAROSCOPIC COLECTOMY</text>
    <text x="740" y="25" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">PHASE: PRE-CLOSURE [HOLD]</text>
  </g>

  <!-- Big Crimson Hazard Banner -->
  <g transform="translate(30, 75)">
    <rect width="940" height="85" rx="14" fill="url(#crimsonBanner)" stroke="#EF4444" stroke-width="2.5" filter="url(#glowH)"/>
    <circle cx="50" cy="42" r="22" fill="#991B1B"/>
    <path d="M 50 28 L 50 46 M 50 54 L 50 56" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="85" y="36" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">DETERMINISTIC CLOSURE GATE &bull; SOVEREIGN INTERLOCK</text>
    <text x="85" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="black" letter-spacing="1">DISCREPANCY [HOLD] &bull; MISSING LAP SPONGE #3</text>
    <rect x="760" y="26" width="160" height="34" rx="8" fill="#991B1B" stroke="#F87171"/>
    <text x="778" y="48" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">DELTA = +1 [HOLD]</text>
  </g>

  <!-- Left: Tray Canvas with Missing Item Highlight -->
  <g transform="translate(30, 175)">
    <rect width="520" height="395" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <rect x="15" y="15" width="490" height="28" rx="6" fill="#0B0F17"/>
    <text x="25" y="34" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">MAYO TRAY COMPUTER VISION SCANNER (SCENARIO B)</text>

    <!-- Synthetic Tray -->
    <rect x="25" y="60" width="470" height="315" rx="10" fill="#070A10" stroke="#EF4444" stroke-dasharray="4,4"/>
    
    <!-- Bounding Box: Detected 9 Sponges -->
    <rect x="45" y="80" width="220" height="130" rx="8" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="2"/>
    <rect x="45" y="58" width="200" height="20" rx="4" fill="#7F1D1D" stroke="#EF4444"/>
    <text x="52" y="72" fill="#FEE2E2" font-family="monospace" font-size="9" font-weight="bold">Lap Sponge 4x4: 9 OF 10 [MISSING 1]</text>

    <!-- Hazard Marker for Missing Item -->
    <g transform="translate(290, 80)">
      <rect width="190" height="130" rx="8" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-dasharray="6,6"/>
      <text x="35" y="65" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="bold">MISSING SPONGE #3</text>
      <text x="20" y="85" fill="#FCA5A5" font-family="monospace" font-size="9">CHECK PERITONEAL CAVITY</text>
    </g>

    <rect x="70" y="235" width="380" height="115" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="2"/>
    <rect x="70" y="215" width="200" height="20" rx="4" fill="#064E3B" stroke="#10B981"/>
    <text x="78" y="229" fill="#ECFDF5" font-family="monospace" font-size="9" font-weight="bold">Forceps (4) &amp; Needles (5) [OK]</text>
  </g>

  <!-- Right: Active Discrepancy Breakdown -->
  <g transform="translate(565, 175)">
    <rect width="405" height="395" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <rect x="15" y="15" width="375" height="28" rx="6" fill="#0B0F17"/>
    <text x="25" y="34" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">ACTIVE DISCREPANCY AUDIT FEED</text>

    <!-- Discrepancy Alert Card -->
    <g transform="translate(15, 60)">
      <rect width="375" height="75" rx="8" fill="#450A0A" stroke="#EF4444"/>
      <text x="12" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">CRITICAL: 1x Lap Sponge 4x4 Unaccounted For</text>
      <text x="12" y="44" fill="#FCA5A5" font-family="sans-serif" font-size="11">Baseline: 10 Registered &bull; Tray Out: 9 Reconciled</text>
      <text x="12" y="62" fill="#FECACA" font-family="monospace" font-size="10">Delta = +1 &bull; Surgical closure locked on HOLD</text>
    </g>

    <!-- Spoken OR Briefing Warning -->
    <g transform="translate(15, 150)">
      <rect width="375" height="110" rx="8" fill="#0B0F17" stroke="#7F1D1D"/>
      <text x="12" y="24" fill="#EF4444" font-family="monospace" font-size="10" font-weight="bold">SPOKEN ATC / OR VOICE WARNING:</text>
      <text x="12" y="50" fill="#FEE2E2" font-family="sans-serif" font-size="11" font-style="italic">&ldquo;Attention Surgical Team. Discrepancy detected: Only nine Lap Sponges counted on tray. One sponge unaccounted for. Closure gate locked on HOLD.&rdquo;</text>
    </g>

    <!-- Recommended Intervention -->
    <g transform="translate(15, 275)">
      <rect width="375" height="105" rx="8" fill="#0B0F17" stroke="#334155"/>
      <text x="12" y="24" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">CLINICAL SAFETY RESOLUTION PROTOCOL:</text>
      <text x="12" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">1. Conduct systematic peritoneal cavity re-exploration.</text>
      <text x="12" y="68" fill="#94A3B8" font-family="sans-serif" font-size="11">2. Perform portable intra-operative X-ray (C-Arm).</text>
      <text x="12" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11">3. Check surgical trash and floor drapes.</text>
    </g>
  </g>
</svg>
