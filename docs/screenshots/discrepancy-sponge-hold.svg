<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420">
  <defs>
    <linearGradient id="bgDis850" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="cardGradDis850" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="crimsonBanner850" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <filter id="glowH850" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" fill="url(#bgDis850)"/>

  <!-- Medical Grid Background -->
  <g opacity="0.08">
    <path d="M 0 35 L 850 35 M 0 70 L 850 70 M 0 105 L 850 105 M 0 140 L 850 140 M 0 175 L 850 175 M 0 210 L 850 210 M 0 245 L 850 245 M 0 280 L 850 280 M 0 315 L 850 315 M 0 350 L 850 350 M 0 385 L 850 385" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 35 0 L 35 420 M 70 0 L 70 420 M 105 0 L 105 420 M 140 0 L 140 420 M 175 0 L 175 420 M 210 0 L 210 420 M 245 0 L 245 420 M 280 0 L 280 420 M 315 0 L 315 420 M 350 0 L 350 420 M 385 0 L 385 420 M 420 0 L 420 420 M 455 0 L 455 420 M 490 0 L 490 420 M 525 0 L 525 420 M 560 0 L 560 420 M 595 0 L 595 420 M 630 0 L 630 420 M 665 0 L 665 420 M 700 0 L 700 420 M 735 0 L 735 420 M 770 0 L 770 420 M 805 0 L 805 420" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Top Micro-Bar -->
  <g transform="translate(20, 16)">
    <rect width="810" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="21" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" letter-spacing="1">SURGIGUARD AI // CASE #SG-9042</text>
    <text x="250" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PROCEDURE: LAPAROSCOPIC COLECTOMY</text>
    <text x="660" y="21" fill="#EF4444" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold">PHASE: PRE-CLOSURE [HOLD]</text>
  </g>

  <!-- Crimson Hazard Status Banner -->
  <g transform="translate(20, 56)">
    <rect width="810" height="60" rx="10" fill="url(#crimsonBanner850)" stroke="#EF4444" stroke-width="2" filter="url(#glowH850)"/>
    <circle cx="36" cy="30" r="16" fill="#991B1B"/>
    <path d="M 36 20 L 36 32 M 36 38 L 36 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="24" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" letter-spacing="1.5">DETERMINISTIC CLOSURE GATE &bull; SOVEREIGN INTERLOCK</text>
    <text x="64" y="47" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing="0.5">GATE STATUS: DISCREPANCY [HOLD] &bull; MISSING LAP SPONGE #3</text>
    <rect x="668" y="14" width="128" height="32" rx="6" fill="#991B1B" stroke="#F87171"/>
    <text x="684" y="34" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold">DELTA = -1 [HOLD]</text>
  </g>

  <!-- Left Column: Mayo Tray Vision Area with Missing Item -->
  <g transform="translate(20, 126)">
    <rect width="450" height="275" rx="10" fill="url(#cardGradDis850)" stroke="#1E293B" stroke-width="1"/>
    <rect x="10" y="10" width="430" height="22" rx="4" fill="#0B0F17"/>
    <text x="18" y="25" fill="#EF4444" font-family="ui-monospace, monospace" font-size="9.5" font-weight="bold">MAYO TRAY OPTICAL VISION (SCENARIO B &bull; MISSING SPONGE)</text>

    <!-- Synthetic Tray Base -->
    <rect x="10" y="38" width="430" height="225" rx="6" fill="#070A10" stroke="#EF4444" stroke-dasharray="3,3"/>

    <!-- Detected 9 Sponges Box -->
    <rect x="20" y="48" width="190" height="95" rx="5" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="20" y="48" width="150" height="15" rx="3" fill="#7F1D1D"/>
    <text x="26" y="59" fill="#FEE2E2" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Lap Sponge 4x4: 9 OF 10 [MISSING 1]</text>

    <!-- Missing Item Alert Box -->
    <g transform="translate(225, 48)">
      <rect width="205" height="95" rx="5" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-dasharray="4,4"/>
      <text x="35" y="42" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MISSING SPONGE #3</text>
      <text x="22" y="62" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="8.5">CRITICAL: Lap Sponge #3 Unaccounted (Delta = -1)</text>
    </g>

    <!-- Needles & Forceps -->
    <rect x="20" y="152" width="410" height="98" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="20" y="152" width="180" height="15" rx="3" fill="#064E3B"/>
    <text x="26" y="163" fill="#ECFDF5" font-family="ui-monospace, monospace" font-size="8" font-weight="bold">Forceps (4) &amp; Needles (5) [MATCHED]</text>
  </g>

  <!-- Right Column: Discrepancy Breakdown -->
  <g transform="translate(480, 126)">
    <rect width="350" height="275" rx="10" fill="url(#cardGradDis850)" stroke="#1E293B" stroke-width="1"/>
    <rect x="10" y="10" width="330" height="22" rx="4" fill="#0B0F17"/>
    <text x="18" y="25" fill="#EF4444" font-family="ui-monospace, monospace" font-size="9.5" font-weight="bold">ACTIVE DISCREPANCY AUDIT FEED</text>

    <!-- Alert Card -->
    <g transform="translate(10, 38)">
      <rect width="330" height="52" rx="5" fill="#450A0A" stroke="#EF4444"/>
      <text x="10" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">CRITICAL: 1x Lap Sponge 4x4 Missing</text>
      <text x="10" y="32" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9">Baseline: 10 Registered &bull; Tray Out: 9 Reconciled</text>
      <text x="10" y="44" fill="#FECACA" font-family="ui-monospace, monospace" font-size="8.5">Delta = -1 &bull; Surgical closure locked on HOLD</text>
    </g>

    <!-- Spoken OR Card -->
    <g transform="translate(10, 96)">
      <rect width="330" height="78" rx="5" fill="#0B0F17" stroke="#7F1D1D"/>
      <text x="10" y="16" fill="#EF4444" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold">SPOKEN ATC / OR VOICE WARNING:</text>
      <text x="10" y="34" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="9" font-style="italic">&ldquo;Attention Surgical Team. Discrepancy detected: Only 9 Lap Sponges counted on tray. Sponge #3 unaccounted for. Closure locked on HOLD.&rdquo;</text>
    </g>

    <!-- Action Protocol -->
    <g transform="translate(10, 180)">
      <rect width="330" height="84" rx="5" fill="#0B0F17" stroke="#334155"/>
      <text x="10" y="16" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold">CLINICAL RESOLUTION PROTOCOL:</text>
      <text x="10" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">1. Perform peritoneal cavity re-exploration.</text>
      <text x="10" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">2. Order intra-operative C-Arm X-ray sweep.</text>
      <text x="10" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">3. Search surgical drapes and kick buckets.</text>
    </g>
  </g>
</svg>
